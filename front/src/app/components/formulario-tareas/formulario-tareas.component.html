<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Añadir nueva tarea</h4>
        </div>
        
        <div class="card-body">
          <form [formGroup]="tareaForm" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre *</label>
              <input type="text" id="nombre" class="form-control" 
                     formControlName="nombre">
            </div>

            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción *</label>
              <textarea id="descripcion" class="form-control" 
                       formControlName="descripcion" rows="3"></textarea>
            </div>

            <div class="mb-3">
              <label for="estado" class="form-label">Estado *</label>
              <select id="estado" class="form-select" 
                      formControlName="estado">
                <option value="PENDIENTE">Pendiente</option>
                <option value="EN_PROGRESO">En progreso</option>
                <option value="COMPLETADA">Completada</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="prioridad" class="form-label">Prioridad *</label>
              <select id="prioridad" class="form-select" 
                      formControlName="prioridad">
                <option value="BAJA">Baja</option>
                <option value="MEDIA">Media</option>
                <option value="ALTA">Alta</option>
              </select>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success" 
                      [disabled]="tareaForm.invalid">
                Guardar
              </button>
              <button type="reset" class="btn btn-secondary">
                Limpiar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div class="toast align-items-center text-bg-success border-0 fade" [class.show]="showToast" role="alert">
    <div class="d-flex">
      <div class="toast-body">
        Tarea creada correctamente
      </div>
    </div>
  </div>
</div>
